spec_version: 1
id: health
order: 20
title: Run health
question: Did anything fail, collapse or look suspicious?
description: >
  Automatic checks over every case before anyone trusts the numbers. Thresholds are in
  config/health.yaml.
sections:
  - title: Status
    visuals:
      - id: health_kpis
        type: health_summary
      - id: matrix
        type: health_matrix
        title: Findings per case and check
        width: 6
      - id: oe_by_case_check
        type: line
        title: Oil equivalent rate - look for cliffs and early ends
        measure: oe_rate
        color: case
        cases: all
        width: 6
  - title: Findings
    visuals:
      - id: findings
        type: health_table
        top_n: 200
  - title: Where it happened
    visuals:
      - id: liquid_by_group
        type: heatmap
        title: Liquid rate by well group and year (focus case)
        measure: liquid_rate
        x: period
        color: entity.group
        grain: year
        cases: focus
        width: 6
      - id: separator_pressure_check
        type: line
        measure: separator_pressure
        color: case
        cases: all
        width: 6
      - id: health_note
        type: note
        note: |
          TODO(engineer): which signals matter most? Candidates from the Power BI report: PE5
          stability flag, below-Turner velocity, erosional velocity ratio, constraint saturation
          (separator/compressor capacity) and production efficiency. Add properties to the
          checks in health.py / config/health.yaml once Autogration exports them.
