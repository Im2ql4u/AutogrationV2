spec_version: 1
id: overview
order: 10
title: Study overview
question: How does this study perform overall?
description: >
  The first page an engineer sees for a finished study. Focus case vs baseline headline numbers,
  then the production profile and how it splits across fields.
sections:
  - title: Headline numbers
    visuals:
      - id: headline
        type: kpi
        title: Focus case vs baseline
        compare: delta
        measures: [oe_volume_mmboe, oil_volume, gas_volume, water_injection_volume, cum_water]
      - id: peaks
        type: kpi
        title: Peaks
        stat: max
        compare: delta
        measures: [oe_rate_boepd, oil_rate, gas_rate, producing_wells]
  - title: Production profile
    visuals:
      - id: oe_profile_by_field
        type: area
        measure: oe_rate
        color: entity.field
        cases: focus
        width: 6
      - id: oil_rate_by_case
        type: line
        measure: oil_rate
        color: case
        width: 6
      - id: annual_volumes
        type: column
        measure: oe_volume_mmboe
        grain: year
        color: entity.field
        cases: focus
        width: 6
      - id: cum_oil_by_case
        type: line
        measure: cum_oil
        color: case
        width: 6
  - title: Fluids
    visuals:
      - id: wct_by_case
        type: line
        measure: wct
        color: case
        grain: quarter
        width: 6
      - id: gor_by_case
        type: line
        measure: gor
        color: case
        grain: quarter
        width: 6
      - id: sales_note
        type: note
        note: |
          TODO(engineer): volumes here are gross separator volumes (SSF). The Power BI report reports
          sales volumes (MSS) using split-factor sets and a 40 MJ GCV basis, and a net view using
          license working interest. Decide which is the default and fill `oil_sales_factor`,
          `gas_sales_factor` and `working_interest` in entities.csv.
