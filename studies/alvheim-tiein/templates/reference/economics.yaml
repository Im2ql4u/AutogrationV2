# Economic assumptions. Agree every number with the commercial/planning owner and record
# the source next to it; nothing here should be a silent default.

# value_basis: oe   -> relative earnings: value = produced Sm3 oil equivalent (gas / 1000),
#                      no price deck needed; costs and tariff rates below are read in Sm3 oe.
# value_basis: price -> money: needs prices.csv; values in `currency`.
value_basis: oe
currency: USD                      # used with value_basis: price
valuation_date: 2027-01-01         # discounting reference date
discount_rate: 0.08                # annual, applied mid-period
opex_per_sm3oe: 0.0                # variable cost per produced Sm3 oe
water_cost_per_sm3: 0.0            # produced-water handling cost
tax_rate: 0.0                      # 0 = pre-tax. ~0.78 is the NCS marginal rate (approximation only)
gas_sm3_per_sm3oe: 1000.0          # Sodir convention

# Per-unit tariffs from the user (new tie-in) licence to the facility owner licence.
# basis: oil_sm3 | gas_sm3 | water_sm3 | oe_sm3
tariffs: []
#  - payer_license: "<new tie-in licence>"
#    payee_license: "203"
#    basis: oe_sm3
#    rate: 0.0
#    description: "<processing tariff, agreement reference>"
