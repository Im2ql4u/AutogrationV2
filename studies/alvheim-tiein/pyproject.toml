[project]
name = "alvheim-tiein"
version = "0.1.0"
description = "Alvheim tie-in study: drive Autogration runs, compare with/without, value them per licence and partner, and settle who pays whom."
requires-python = ">=3.12"
dependencies = [
    "autogration-results",
    "azure-identity>=1.19",
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
viewer = ["autogration-results[app]"]

[project.scripts]
tiein = "alvheim_tiein.cli:main"

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv.sources]
autogration-results = { path = "../../results-workbench", editable = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alvheim_tiein"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.format]
# Generated by notebooks/_build_notebooks.py, which is where their cells are edited.
exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "PTH", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Verbatim CSV fixture rows.
"tests/test_sodir.py" = ["E501"]
# Notebook cell sources, kept as they read in the notebooks.
"notebooks/_build_notebooks.py" = ["E501"]
"notebooks/*.ipynb" = ["E501"]
